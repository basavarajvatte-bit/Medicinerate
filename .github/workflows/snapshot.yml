name: list-snapshot
on:
  schedule:
    - cron: "30 20 * * *"   # रोज रात्री 2:00 (भारतीय वेळ)
  push:
    paths: [".github/snapshot-trigger"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 60 https://tuljabhavani-medical.pages.dev/api/list -o list.json
          python3 -c "import json;d=json.load(open('list.json'));print(len(d.get('meds') or []))"
          git init -q snap && mv list.json snap/ && cd snap
          git config user.name "list-snapshot" && git config user.email "actions@github.com"
          git checkout -q -b snapshot && git add list.json && git commit -qm "snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" snapshot

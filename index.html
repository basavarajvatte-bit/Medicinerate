<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawa Price Compare</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#14281d;--mute:#5d7366;--line:#d5e2d9;--brand:#0f6b46;--brand-ink:#fff;--good:#0f6b46;--goodbg:#dff3e7;--bad:#a4261c;--badbg:#fbe4e1;--accent:#e8a317;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a14;--card:#16261d;--ink:#e6f2ea;--mute:#93ab9c;--line:#274034;--brand:#3ec58a;--brand-ink:#08150f;--good:#6fe0ab;--goodbg:#173a29;--bad:#ff8f84;--badbg:#42201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a14;--card:#16261d;--ink:#e6f2ea;--mute:#93ab9c;--line:#274034;--brand:#3ec58a;--brand-ink:#08150f;--good:#6fe0ab;--goodbg:#173a29;--bad:#ff8f84;--badbg:#42201c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Mukta,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);font:600 15px Mukta,sans-serif;padding:9px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
input,textarea{width:100%;font:400 17px Mukta,sans-serif;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:14px;color:var(--mute)}
.list{margin-top:10px;display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.item small{display:block;color:var(--mute);font-size:13px}
.price{font-weight:800;color:var(--brand);white-space:nowrap}
.result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.result h2{margin:0;font-size:21px}
.salt{color:var(--mute);margin:0 0 12px;font-size:14px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.big{font-size:30px;font-weight:800;color:var(--brand)}
.verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:600}
.verdict.good{background:var(--goodbg);color:var(--good)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.btn{border:0;background:var(--brand);color:var(--brand-ink);font:700 16px Mukta,sans-serif;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--bad);border:1.5px solid var(--line);padding:6px 10px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mute);text-align:center;padding:18px}
.note{font-size:13px;color:var(--mute);margin-top:14px}
.hide{display:none}
.pick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.gal{display:block;text-align:center;color:var(--brand);font-weight:600;text-decoration:underline;margin:-2px 0 10px;cursor:pointer}
.scan{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;padding:16px;margin-bottom:12px;border-radius:14px}
.sum{display:flex;justify-content:space-between;font-weight:800;padding:12px 14px;border-radius:12px;background:var(--goodbg);color:var(--good);margin-top:4px}
.un{color:var(--bad);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dawa ka rate compare karo</h1>
  <p class="sub">Doctor ne jo dawa likhi hai, uska hamare yahan ka rate turant dekho.</p>
  <div class="tabs" role="tablist">
    <button id="t1" class="on" role="tab">Compare</button>
    <button id="t2" role="tab">Rate list (dukaan)</button>
  </div>

  <section id="p1">
    <label class="btn scan" id="scanbtn" for="file"><span aria-hidden="true">📷</span> Camera se scan karo</label>
    <input id="file" class="pick" type="file" accept="image/*" capture="environment">
    <label class="gal" for="file2">ya gallery se photo chuno</label>
    <input id="file2" class="pick" type="file" accept="image/*">
    <div id="scanres"></div>
    <p class="salt" style="text-align:center;margin:6px 0">ya naam type karo</p>
    <input id="q" type="search" placeholder="Dawa ya salt ka naam likho…" autocomplete="off" aria-label="Dawa ka naam">
    <div id="sug" class="list"></div>
    <div id="res"></div>
  </section>

  <section id="p2" class="hide">
    <div class="result" style="margin-top:0">
      <label for="n">Dawa ka naam</label><input id="n" placeholder="Jaise: Dolo 650">
      <label for="s">Salt / composition</label><input id="s" placeholder="Jaise: Paracetamol 650mg">
      <div class="grid2">
        <div><label for="m">MRP (₹)</label><input id="m" type="number" inputmode="decimal" min="0"></div>
        <div><label for="p">Hamara rate (₹)</label><input id="p" type="number" inputmode="decimal" min="0"></div>
      </div>
      <p><button class="btn" id="add">Dawa jodo</button></p>
    </div>
    <div class="result">
      <b>Bulk import (CSV)</b>
      <p class="salt">Har line: naam, salt, MRP, hamara rate</p>
      <textarea id="csv" rows="4" placeholder="Dolo 650, Paracetamol 650mg, 30, 25"></textarea>
      <p><button class="btn" id="imp">Import karo</button></p>
    </div>
    <div id="all" class="list"></div>
    <p class="note">Yeh list sirf is phone/browser me save hoti hai. Sab customers ko same rate dikhane ke liye shared database lagana padega.</p>
  </section>
</div>
<script>
var DEF=[
{n:"Dolo 650",s:"Paracetamol 650mg",m:30.91,p:26},
{n:"Crocin Advance 500",s:"Paracetamol 500mg",m:20.5,p:17},
{n:"Azithral 500",s:"Azithromycin 500mg",m:119.5,p:98},
{n:"Pan 40",s:"Pantoprazole 40mg",m:155,p:128},
{n:"Cetzine 10",s:"Cetirizine 10mg",m:54,p:44},
{n:"Augmentin 625",s:"Amoxicillin + Clavulanic acid",m:223,p:190},
{n:"Shelcal 500",s:"Calcium + Vitamin D3",m:128,p:105},
{n:"Glycomet 500",s:"Metformin 500mg",m:42,p:35}];
var meds;
try{meds=JSON.parse(localStorage.getItem("meds")||"null")}catch(e){meds=null}
if(!Array.isArray(meds))meds=DEF.slice();
function save(){try{localStorage.setItem("meds",JSON.stringify(meds))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fm(x){return "₹"+(Math.round(x*100)/100).toString()}
var sel=null;
function tab(k){$("p1").classList.toggle("hide",k!==1);$("p2").classList.toggle("hide",k!==2);$("t1").classList.toggle("on",k===1);$("t2").classList.toggle("on",k===2);if(k===2)renderAll()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
function suggest(){
  var v=$("q").value.trim().toLowerCase();
  if(!v){$("sug").innerHTML="";return}
  var f=meds.map(function(d,i){return{d:d,i:i}}).filter(function(o){return (o.d.n+" "+o.d.s).toLowerCase().indexOf(v)>-1}).slice(0,6);
  $("sug").innerHTML=f.length?f.map(function(o){return '<button class="item" data-i="'+o.i+'"><span>'+esc(o.d.n)+'<small>'+esc(o.d.s)+'</small></span><span class="price">'+fm(o.d.p)+'</span></button>'}).join(""):'<div class="empty">Yeh dawa list me nahi hai. Dukaan par puchho.</div>';
}
$("q").oninput=function(){sel=null;$("res").innerHTML="";suggest()};
$("sug").onclick=function(e){var b=e.target.closest("button");if(!b)return;sel=+b.dataset.i;$("sug").innerHTML="";$("q").value=meds[sel].n;show()};
function show(){
  var d=meds[sel];if(!d)return;
  var off=Math.round((1-d.p/d.m)*100);
  $("res").innerHTML='<div class="result"><h2>'+esc(d.n)+'</h2><p class="salt">'+esc(d.s)+'</p>'+
  '<div class="row"><span>MRP</span><b>'+fm(d.m)+'</b></div>'+
  '<div class="row"><span>Hamare yahan</span><span class="big">'+fm(d.p)+'</span></div>'+
  '<div class="row"><span>MRP se bachat</span><b>'+fm(d.m-d.p)+' ('+off+'% off)</b></div>'+
  '<label for="o">Aapko dusri jagah kitne me mili? (₹)</label><input id="o" type="number" inputmode="decimal" min="0" placeholder="Jaise: '+Math.round(d.m)+'">'+
  '<div id="vd"></div></div>';
  $("o").oninput=function(){
    var o=parseFloat($("o").value),v=$("vd");
    if(isNaN(o)){v.innerHTML="";return}
    var df=Math.round((o-d.p)*100)/100;
    if(df>0)v.innerHTML='<div class="verdict good">Hamare yahan '+fm(df)+' sasta hai.</div>';
    else if(df<0)v.innerHTML='<div class="verdict bad">Dusri jagah '+fm(-df)+' sasta hai.</div>';
    else v.innerHTML='<div class="verdict good">Dono jagah rate barabar hai.</div>';
  };
}
function renderAll(){
  $("all").innerHTML=meds.length?meds.map(function(d,i){return '<div class="item" style="cursor:default"><span>'+esc(d.n)+'<small>'+esc(d.s)+' · MRP '+fm(d.m)+'</small></span><span><span class="price">'+fm(d.p)+'</span> <button class="btn ghost" data-del="'+i+'">Hatao</button></span></div>'}).join(""):'<div class="empty">Abhi koi dawa nahi hai. Upar se jodo.</div>';
}
$("all").onclick=function(e){var b=e.target.closest("[data-del]");if(!b)return;meds.splice(+b.dataset.del,1);save();renderAll()};
$("add").onclick=function(){
  var n=$("n").value.trim(),m=parseFloat($("m").value),p=parseFloat($("p").value);
  if(!n||isNaN(m)||isNaN(p)){alert("Naam, MRP aur hamara rate teeno bharo.");return}
  meds.push({n:n,s:$("s").value.trim(),m:m,p:p});save();
  ["n","s","m","p"].forEach(function(i){$(i).value=""});renderAll();
};
$("imp").onclick=function(){
  var c=0;$("csv").value.split("\n").forEach(function(l){
    var a=l.split(",").map(function(x){return x.trim()});
    var m=parseFloat(a[2]),p=parseFloat(a[3]);
    if(a[0]&&!isNaN(m)&&!isNaN(p)){meds.push({n:a[0],s:a[1]||"",m:m,p:p});c++}
  });
  save();$("csv").value="";renderAll();alert(c+" dawa import hui.");
};

var smp=null;
function noscan(){smp=null}
try{claude.use("sample").then(function(x){smp=x;if(!x)noscan()})}catch(e){noscan()}
function shrink(f){return new Promise(function(ok,no){
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){var k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no(new Error("img"))},"image/jpeg",0.82)};
  im.onerror=function(){no(new Error("img"))};im.src=u})}
async function doScan(f){
  var out=$("scanres");$("res").innerHTML="";$("sug").innerHTML="";
  if(!smp){out.innerHTML='<div class="empty">Scan yahan available nahi hai. Link ko Claude app ya claude.ai me kholo, ya naam type karo.</div>';return}
  out.innerHTML='<div class="empty">Padh raha hu… thoda ruko</div>';
  try{
    var blob=await shrink(f);
    var list=meds.map(function(d,i){return i+": "+d.n+" ("+d.s+")"}).join("\n");
    var r=await smp.json("Image me dawa ka strip/box ya doctor ki parchi hai (handwriting bhi ho sakti hai). Usme likhi saari dawaiyan padho aur neeche ki LIST se match karo (brand ya salt same ho to match). Sirf JSON do, aur kuch nahi: {\"matches\":[{\"idx\":<list number>}],\"unmatched\":[\"image me padhi gayi dawa jo list me nahi hai\"]}. Andaza mat lagao: pakka na ho to unmatched me daalo.\n\nLIST:\n"+list,{images:[blob]});
    var seen={},ms=[];
    (r.matches||[]).forEach(function(m){var i=+m.idx;if(meds[i]&&!seen[i]){seen[i]=1;ms.push(i)}});
    var h="";
    if(ms.length){
      h+='<div class="list">'+ms.map(function(i){var d=meds[i];return '<button class="item" data-i="'+i+'"><span>'+esc(d.n)+'<small>'+esc(d.s)+' · MRP '+fm(d.m)+'</small></span><span class="price">'+fm(d.p)+'</span></button>'}).join("")+'</div>';
      if(ms.length>1){var t=0,mm=0;ms.forEach(function(i){t+=meds[i].p;mm+=meds[i].m});
        h+='<div class="sum"><span>Total (hamare yahan)</span><span>'+fm(t)+'</span></div><p class="salt" style="margin:6px 2px">MRP total '+fm(mm)+' · bachat '+fm(mm-t)+'</p>'}
    }
    var un=(r.unmatched||[]).filter(Boolean);
    if(un.length)h+='<div class="un">List me nahi mili: '+un.map(esc).join(", ")+'. Dukaan par puchho.</div>';
    if(!h)h='<div class="empty">Dawa pehchani nahi gayi. Saaf photo lo ya naam type karo.</div>';
    out.innerHTML=h;
  }catch(e){
    out.innerHTML='<div class="empty">'+(e&&e.code==="not_granted"?"Scan ki permission nahi mili. Naam type karo.":"Scan nahi ho paya. Dobara try karo ya naam type karo.")+'</div>';
  }
};
$("file").onchange=function(){var f=this.files[0];this.value="";if(f)doScan(f)};
$("file2").onchange=function(){var f=this.files[0];this.value="";if(f)doScan(f)};
$("scanres").onclick=function(e){var b=e.target.closest("button[data-i]");if(!b)return;sel=+b.dataset.i;$("q").value=meds[sel].n;show();$("res").scrollIntoView({behavior:"smooth"})};
</script>
</body>
</html>
